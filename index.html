<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HokuPédia</title>
    <link rel="icon" type="image/png" href="/Img/LogoSnome.png" />
    <link rel="stylesheet" href="/CSS/stylesheet.css" />
    <link rel="stylesheet" href="/CSS/MenuLat.css" />
  </head>
  <body>
    <header class="menu-lateral-header">
      <button class="menu-lateral-button" id="menuBtn" type="button" aria-label="Abrir dashboard" aria-expanded="false" aria-controls="dashboard">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <h1 class="menu-lateral-logo"><a href="/" aria-label="Ir para a página inicial"><img src="/Img/LogoSnome.png" alt="" />HokuPédia</a></h1>
      <form class="work-search" role="search" autocomplete="off">
        <label class="work-search__label" for="work-search-input">Buscar obra por nome</label>
        <input id="work-search-input" type="search" name="q" placeholder="Buscar obra..." aria-autocomplete="list" aria-controls="work-search-results" aria-expanded="false" />
        <div class="work-search__results" id="work-search-results" role="listbox" aria-live="polite" hidden></div>
      </form>
      <a class="header-login" href="/HTML/CadLog.html?mode=login">Login</a>
    </header>
    <button class="menu-lateral-overlay" id="menuOverlay" type="button" aria-label="Fechar dashboard" hidden></button>
    <aside class="menu-lateral-dashboard" id="dashboard" aria-label="Navegação principal" aria-hidden="true" inert>
      <nav class="menu-lateral-items" aria-label="Navegação principal">
        <a class="menu-lateral-item" href="/HTML/Catalogo.html">Catálogo</a>
        <a class="menu-lateral-item" href="/HTML/Biblioteca.html">Biblioteca</a>
        <a class="menu-lateral-item" href="/HTML/GerenciarObras.html">Solicitar moderação</a>
        <a class="menu-lateral-item" href="/HTML/Homologacao.html" data-admin-only hidden>Homologação</a>
        <a class="menu-lateral-item" href="/HTML/CadLog.html?mode=login">Login</a>
      </nav>
    </aside>

    <main>
      <div class="inicio-layout">
        <nav class="categorias" aria-label="Filtrar por categoria">
          <button type="button" data-category-filter="all" aria-pressed="true">Todas</button>
          <button type="button" data-category-filter="hq" aria-pressed="false">HQ's</button>
          <button type="button" data-category-filter="manga" aria-pressed="false">Mangás</button>
          <button type="button" data-category-filter="manhwa" aria-pressed="false">Manhwas</button>
        </nav>
      </div>

      <div class="catalogo" id="catalogo" aria-live="polite">
        <p id="homeCatalogStatus" role="status" aria-live="polite" hidden></p>
        <section class="novidades" id="recommendationsSection" aria-labelledby="titulo-recomendacoes" hidden>
          <h2 id="titulo-recomendacoes">Recomendações</h2>
          <p class="catalog-section-empty" id="recommendationsEmpty" role="status" aria-live="polite" hidden>
            Ainda não encontramos obras com categorias em comum com seu histórico e favoritos.
          </p>
          <div class="carrossel-controles" data-carousel>
            <button class="carrossel-botao" type="button" data-carousel-previous aria-label="Recomendações anteriores">‹</button>
            <div class="carrossel-janela">
              <div class="obras-faixa" data-recommendations></div>
            </div>
            <button class="carrossel-botao" type="button" data-carousel-next aria-label="Próximas recomendações">›</button>
          </div>
        </section>

        <section class="novidades" aria-labelledby="titulo-novidades">
          <h2 id="titulo-novidades">Novidades</h2>
          <div class="carrossel-controles" data-carousel>
            <button class="carrossel-botao" type="button" data-carousel-previous aria-label="Obras anteriores">‹</button>
            <div class="carrossel-janela">
              <div class="obras-faixa"></div>
            </div>
            <button class="carrossel-botao" type="button" data-carousel-next aria-label="Próximas obras">›</button>
          </div>
        </section>

        <section class="novidades" aria-labelledby="titulo-obras-comunidade">
          <h2 id="titulo-obras-comunidade">Obras da Comunidade</h2>
          <p id="communityWorksStatus" role="status" aria-live="polite"></p>
          <div class="carrossel-controles" data-carousel>
            <button class="carrossel-botao" type="button" data-carousel-previous aria-label="Obras anteriores">‹</button>
            <div class="carrossel-janela">
              <div class="obras-faixa" data-community-works></div>
            </div>
            <button class="carrossel-botao" type="button" data-carousel-next aria-label="Próximas obras">›</button>
          </div>
        </section>

        <section class="capnovos" aria-labelledby="titulo-capnovos">
          <h2 id="titulo-capnovos">Capítulos Novos</h2>
          <div class="carrossel-controles" data-carousel>
            <button class="carrossel-botao" type="button" data-carousel-previous aria-label="Capítulos anteriores">‹</button>
            <div class="carrossel-janela">
              <div class="obras-faixa"></div>
            </div>
            <button class="carrossel-botao" type="button" data-carousel-next aria-label="Próximos capítulos">›</button>
          </div>
        </section>

        <p class="catalogo-vazio" hidden>Nenhuma obra encontrada.</p>
      </div>
    </main>
    <script type="module" src="/JAVA/MenuLat.js"></script>
    <script type="module" src="/JS/WorkSearch.js"></script>
  </body>
</html>
