<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HokuPedia - Biblioteca</title>
    <link rel="stylesheet" href="../CSS/Biblioteca.css" />
    <link rel="stylesheet" href="../CSS/MenuLat.css" />
  </head>
  <body>
    <header class="topbar">
      <button class="menu-lateral-button" id="menuBtn" type="button" aria-label="Abrir dashboard" aria-expanded="false" aria-controls="dashboard">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="logo">HokuPedia</div>
    </header>

    <button class="menu-lateral-overlay" id="menuOverlay" type="button" aria-label="Fechar dashboard" hidden></button>

    <aside class="menu-lateral-dashboard" id="dashboard" aria-labelledby="dashboardTitle" aria-hidden="true" inert>
      <div class="menu-lateral-dashboard-header">
        <h2 id="dashboardTitle">Dashboard</h2>
        <button class="menu-lateral-close" id="closeDashboard" type="button" aria-label="Fechar dashboard">×</button>
      </div>
      <nav class="menu-lateral-items" aria-label="Itens do dashboard">
        <button class="menu-lateral-item" type="button" aria-pressed="false">1</button>
        <button class="menu-lateral-item" type="button" aria-pressed="false">2</button>
        <button class="menu-lateral-item" type="button" aria-pressed="false">3</button>
      </nav>
      <p class="menu-lateral-selection" id="dashboardSelection" aria-live="polite">Selecione um item.</p>
    </aside>

    <main class="page-shell">
      <section class="library-section">
        <h2>Novidades</h2>

        <div class="feature-row">
          <div class="thumb-grid">
            <article class="scene-card scene-blue">
              <div class="cloud cloud-left"></div>
              <div class="hill hill-back"></div>
              <div class="hill hill-front"></div>
            </article>

            <article class="scene-card scene-blue">
              <div class="cloud cloud-center"></div>
              <div class="hill hill-back"></div>
              <div class="hill hill-front"></div>
            </article>

            <article class="scene-card scene-blue">
              <div class="cloud cloud-right"></div>
              <div class="hill hill-back"></div>
              <div class="hill hill-front"></div>
            </article>
          </div>

          <aside class="summary-panel">
            <div class="summary-copy">
              <p>Nickname</p>
              <p>Contagem</p>
            </div>

            <div class="summary-badge" aria-label="Logo da banda">
              <div class="badge-ring">
                <span>SB</span>
              </div>
              <small>SB19</small>
            </div>
          </aside>
        </div>
      </section>

      <section class="library-section">
        <h2>Histórico</h2>

        <div class="thumb-grid historic-grid">
          <article class="scene-card scene-blue">
            <div class="cloud cloud-left"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-center"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-right"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-left"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-center"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-right"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>
        </div>
      </section>

      <section class="library-section">
        <h2>Favoritos</h2>

        <div class="thumb-grid favorites-grid">
          <article class="scene-card scene-blue">
            <div class="cloud cloud-left"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-center"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-right"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-left"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-center"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-right"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>
        </div>
      </section>
    </main>
    <script src="../JAVA/MenuLat.js"></script>
  </body>
</html>
