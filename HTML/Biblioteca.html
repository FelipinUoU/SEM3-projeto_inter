<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HokuPedia - Biblioteca</title>
    <link rel="stylesheet" href="../CSS/Biblioteca.css" />
    <link rel="stylesheet" href="../CSS/MenuLat.css" />
  </head>
  <body>
    <header class="topbar">
      <button class="menu-lateral-button" id="menuBtn" type="button" aria-label="Abrir dashboard" aria-expanded="false" aria-controls="dashboard">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="logo">HokuPedia</div>
      <div class="boxbody">
        <a href="/HTML/Biblioteca.html" aria-label="Abrir biblioteca">
          <img src="../Img/PerfilExemplo.svg" alt="Avatar do perfil">
        </a>
      </div>
    </header>

    <button class="menu-lateral-overlay" id="menuOverlay" type="button" aria-label="Fechar dashboard" hidden></button>

    <aside class="menu-lateral-dashboard" id="dashboard" aria-label="Navegação principal" aria-hidden="true" inert>
      <nav class="menu-lateral-items" aria-label="Navegação principal">
        <button class="menu-lateral-item" type="button" data-href="/">Home</button>
        <button class="menu-lateral-item" type="button" data-href="/HTML/Biblioteca.html">Biblioteca</button>
        <button class="menu-lateral-item" type="button" data-href="/HTML/Login.html">Login</button>
      </nav>
    </aside>

    <main class="page-shell">
      <section class="library-section">
        <h2>Ultimas Leituras</h2>

        <div class="feature-row">
          <div class="thumb-grid">
            <article class="scene-card scene-blue">
              <div class="cloud cloud-left"></div>
              <div class="hill hill-back"></div>
              <div class="hill hill-front"></div>
            </article>

            <article class="scene-card scene-blue">
              <div class="cloud cloud-center"></div>
              <div class="hill hill-back"></div>
              <div class="hill hill-front"></div>
            </article>

            <article class="scene-card scene-blue">
              <div class="cloud cloud-right"></div>
              <div class="hill hill-back"></div>
              <div class="hill hill-front"></div>
            </article>
          </div>

          <aside class="summary-panel">
            <div class="summary-copy">
              <button class="nickname-edit-button" id="nicknameEditButton" type="button" aria-controls="nicknameInput" aria-expanded="false">
                <span id="nicknameText">Nickname</span>
                <svg class="nickname-edit-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                  <path d="M14.06 9.02 15 9.96 5.92 19H5v-.92l9.06-9.06M17.66 3c-.26 0-.53.1-.73.3l-1.83 1.83 3.77 3.77 1.83-1.83a1.03 1.03 0 0 0 0-1.46l-2.31-2.31a1.03 1.03 0 0 0-.73-.3ZM14.06 6.54 3 17.6V21h3.4L17.46 9.94l-3.4-3.4Z"/>
                </svg>
              </button>
              <input class="nickname-input" id="nicknameInput" type="text" placeholder="Digite seu nickname" autocomplete="nickname" aria-label="Nickname" hidden>
              <p>Contagem</p>
            </div>

            <div class="summary-badge">
              <img class="badge-avatar" src="../Img/PerfilExemplo.svg" alt="Avatar de exemplo">
            </div>
          </aside>
        </div>
      </section>

      <section class="library-section">
        <h2>Histórico</h2>

        <div class="thumb-grid historic-grid">
          <article class="scene-card scene-blue">
            <div class="cloud cloud-left"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-center"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-right"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-left"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-center"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-right"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>
        </div>
      </section>

      <section class="library-section">
        <h2>Favoritos</h2>

        <div class="thumb-grid favorites-grid">
          <article class="scene-card scene-blue">
            <div class="cloud cloud-left"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-center"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-right"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-left"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-center"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>

          <article class="scene-card scene-blue">
            <div class="cloud cloud-right"></div>
            <div class="hill hill-back"></div>
            <div class="hill hill-front"></div>
          </article>
        </div>
      </section>
    </main>
    <script type="module" src="../JAVA/MenuLat.js"></script>
    <script type="module" src="../JAVA/Biblioteca.js"></script>
  </body>
</html>
