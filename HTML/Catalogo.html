<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#29272f">
    <title>Catálogo | HokuPédia</title>
    <link rel="icon" type="image/png" href="/Img/LogoSnome.png">
    <link rel="stylesheet" href="../CSS/MenuLat.css">
    <link rel="stylesheet" href="../CSS/Catalogo.css">
</head>
<body>
    <header class="menu-lateral-header">
        <button class="menu-lateral-button" id="menuBtn" type="button" aria-label="Abrir navegação" aria-expanded="false" aria-controls="dashboard">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <h1 class="menu-lateral-logo"><a href="/" aria-label="Ir para a página inicial"><img src="/Img/LogoSnome.png" alt="">HokuPédia</a></h1>
        <form class="work-search" role="search" autocomplete="off">
            <label class="work-search__label" for="work-search-input">Buscar obra por nome</label>
            <input id="work-search-input" type="search" name="q" placeholder="Buscar obra..." aria-autocomplete="list" aria-controls="work-search-results" aria-expanded="false">
            <div class="work-search__results" id="work-search-results" role="listbox" aria-live="polite" hidden></div>
        </form>
        <a class="header-avatar" href="/HTML/Perfil.html" aria-label="Meu perfil">
            <img src="../Img/Perfil/PerfilExemplo.svg" alt="">
        </a>
    </header>

    <button class="menu-lateral-overlay" id="menuOverlay" type="button" aria-label="Fechar navegação" hidden></button>
    <aside class="menu-lateral-dashboard" id="dashboard" aria-label="Navegação principal" aria-hidden="true" inert>
        <nav class="menu-lateral-items" aria-label="Navegação principal">
            <a class="menu-lateral-item" href="/HTML/Catalogo.html" aria-current="page">Catálogo</a>
            <a class="menu-lateral-item" href="/HTML/Biblioteca.html">Biblioteca</a>
            <a class="menu-lateral-item" href="/HTML/CadLog.html?mode=login">Login</a>
        </nav>
    </aside>

    <main class="catalog-page">
        <section class="genre-section" aria-label="Filtros por gênero">
            <button class="genre-toggle" id="genreToggle" type="button" aria-expanded="false" aria-controls="genrePanel">
                <span>Gêneros</span>
                <span class="genre-chevron" aria-hidden="true"></span>
            </button>
            <div class="genre-panel" id="genrePanel" hidden>
                <div class="genre-filters" id="genreFilters"></div>
            </div>
        </section>

        <section class="catalog-section" aria-labelledby="catalogTitle">
            <div class="catalog-heading">
                <div>
                    <p class="catalog-eyebrow">Descubra sua próxima leitura</p>
                    <h2 id="catalogTitle">Catálogo</h2>
                </div>
            </div>
            <p class="catalog-format-filter" id="catalogFormatFilter" hidden>
                <span id="catalogFormatLabel"></span>
                <button id="clearFormatFilter" type="button">Remover filtro</button>
            </p>
            <p class="catalog-status" id="catalogStatus" role="status" aria-live="polite">Carregando obras...</p>
            <div class="catalog-grid" id="catalogGrid" aria-label="Obras publicadas"></div>
        </section>
    </main>

    <script type="module" src="../JAVA/MenuLat.js"></script>
    <script type="module" src="../JS/WorkSearch.js"></script>
    <script type="module" src="../JS/Catalogo.js"></script>
</body>
</html>
