<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#29272f">
    <title>Obra | HokuPédia</title>
    <link rel="stylesheet" href="../CSS/Obra.css">
    <link rel="stylesheet" href="../CSS/MenuLat.css">
</head>
<body>
    <header class="menu-lateral-header">
        <button class="menu-lateral-button" id="menuBtn" type="button" aria-label="Abrir dashboard" aria-expanded="false" aria-controls="dashboard">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <h1 class="menu-lateral-logo"><a href="/" aria-label="Ir para a página inicial">HokuPédia</a></h1>
        <a class="back-link" href="/HTML/Homologacao.html" data-admin-only hidden>Homologação</a>
        <a class="header-login" href="/HTML/CadLog.html?mode=login">Login</a>
    </header>
    <button class="menu-lateral-overlay" id="menuOverlay" type="button" aria-label="Fechar dashboard" hidden></button>
    <aside class="menu-lateral-dashboard" id="dashboard" aria-label="Navegação principal" aria-hidden="true" inert>
        <nav class="menu-lateral-items" aria-label="Navegação principal">
            <a class="menu-lateral-item" href="/HTML/Catalogo.html">Catálogo</a>
            <a class="menu-lateral-item" href="/HTML/Biblioteca.html">Biblioteca</a>
            <a class="menu-lateral-item" href="/HTML/Homologacao.html" data-admin-only hidden>Homologação</a>
            <a class="menu-lateral-item" href="/HTML/CadLog.html?mode=login">Login</a>
        </nav>
    </aside>

    <main class="work-page">
        <section class="work-summary" aria-labelledby="workTitle">
            <button class="work-cover" id="workCover" type="button" aria-label="Ampliar capa da obra" disabled hidden></button>
            <div class="work-info">
                <div class="work-heading">
                    <div class="work-title-row">
                        <h1 id="workTitle"></h1>
                        <button class="favorite-button" id="favoriteButton" type="button" aria-label="Carregando favorito..." title="Carregando favorito..." aria-pressed="false" disabled>☆</button>
                    </div>
                    <span class="work-divider" aria-hidden="true"></span>
                    <p class="work-description" id="workDescription">Acompanhe os capítulos desta obra.</p>
                </div>
                <div class="work-author">
                    <svg class="author-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="7" r="4"></circle>
                        <path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2"></path>
                    </svg>
                    <span id="workAuthor"></span>
                    <a class="work-format-link" id="workFormat" hidden></a>
                </div>
                <div class="work-genres" id="workGenres" aria-label="Gêneros da obra"></div>
                <p class="favorite-feedback" id="favoriteFeedback" role="status" aria-live="polite"></p>
            </div>
        </section>

        <section class="chapter-section" aria-labelledby="chapterHeading">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Continue de onde parou</p>
                    <h2 id="chapterHeading">Capítulos</h2>
                </div>
            </div>
            <div class="chapter-list" id="chapterList" aria-label="Capítulos disponíveis"></div>
        </section>
    </main>

    <dialog class="work-cover-preview" id="workCoverPreview" aria-label="Visualização ampliada da capa">
        <button class="work-cover-preview-close" type="button" aria-label="Fechar visualização">×</button>
        <img class="work-cover-preview-image" id="workCoverPreviewImage" alt="">
    </dialog>

    <script type="module" src="../JAVA/MenuLat.js"></script>
    <script type="module" src="../JS/Obra.js"></script>
</body>
</html>
