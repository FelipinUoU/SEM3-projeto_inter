<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#29272f">
    <title>Meu perfil | HokuPédia</title>
    <link rel="stylesheet" href="../CSS/Perfil.css">
    <link rel="stylesheet" href="../CSS/MenuLat.css">
</head>
<body>
    <header>
        <button
            class="menu-lateral-button"
            id="menuBtn"
            type="button"
            aria-label="Abrir dashboard"
            aria-expanded="false"
            aria-controls="dashboard">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="logo"><a href="/" aria-label="Ir para a página inicial">HokuPédia</a></div>
    </header>

    <button class="menu-lateral-overlay" id="menuOverlay" type="button" aria-label="Fechar dashboard" hidden></button>

    <aside class="menu-lateral-dashboard" id="dashboard" aria-label="Navegação principal" aria-hidden="true" inert>
        <nav class="menu-lateral-items" aria-label="Navegação principal">
            <a class="menu-lateral-item" href="/">Home</a>
            <a class="menu-lateral-item" href="/HTML/Biblioteca.html">Biblioteca</a>
            <a class="menu-lateral-item" href="/HTML/Perfil.html" aria-current="page">Meu perfil</a>
            <a class="menu-lateral-item" href="/HTML/CadLog.html?mode=login">Login</a>
        </nav>
    </aside>

    <main class="profile-page">
        <input class="profile-mode-toggle" id="editMode" type="checkbox" aria-label="Alternar edição do perfil">

        <section class="profile-card" aria-label="Configurações do perfil">
            <div class="profile-details">
                <div class="profile-view-fields" aria-label="Dados do perfil">
                    <input type="text" placeholder="Nome" aria-label="Nome" readonly>
                    <input type="email" placeholder="Email" aria-label="E-mail" readonly>
                </div>

                <div class="profile-edit-fields" aria-label="Editar dados do perfil">
                    <input type="text" placeholder="Alterar nome" aria-label="Alterar nome" autocomplete="name" maxlength="128">
                    <input type="email" placeholder="Novo e-mail (opcional)" aria-label="Novo e-mail" autocomplete="email">
                    <input type="password" placeholder="Senha atual" aria-label="Senha atual" autocomplete="current-password">
                    <input type="password" placeholder="Nova senha (opcional)" aria-label="Nova senha" autocomplete="new-password" minlength="8" maxlength="256">
                    <input type="password" placeholder="Confirmar nova senha" aria-label="Confirmar nova senha" autocomplete="new-password" minlength="8" maxlength="256">
                    <p class="profile-edit-hint">Informe a senha atual somente para alterar o e-mail ou a senha.</p>
                </div>
                <p class="profile-feedback" id="profileFeedback" role="status" aria-live="polite">Carregando dados do perfil...</p>
                <a class="profile-login-link" id="profileLoginLink" href="/HTML/CadLog.html?mode=login" hidden>Fazer login</a>
            </div>

            <aside class="profile-photo" aria-label="Foto do perfil">
                <img class="profile-avatar profile-avatar--large" src="../Img/Perfil/PerfilExemplo.svg" alt="Foto atual do perfil">
                <div class="photo-actions">
                    <input class="photo-input" id="profilePhotoInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" aria-label="Selecionar nova foto de perfil">
                    <label class="photo-add" for="profilePhotoInput">Adicionar foto</label>
                    <button class="photo-remove" type="button">Remover foto</button>
                </div>
            </aside>

            <div class="profile-actions">
                <label class="profile-button profile-edit-button" for="editMode">
                    <span class="edit-label">Editar</span>
                    <span class="cancel-label">Cancelar edição</span>
                </label>
                <button class="profile-button profile-save-button" type="button">Salvar alterações</button>
                <button class="profile-button profile-delete-button" type="button">Excluir Conta</button>
            </div>
        </section>
    </main>

    <script type="module" src="../JAVA/MenuLat.js"></script>
    <script type="module" src="../JS/Perfil.js"></script>
</body>
</html>
