<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HokuPédia - Cadastro</title>

    <link rel="stylesheet" href="../CSS/Cadastro.css">
    <link rel="stylesheet" href="../CSS/MenuLat.css">
</head>

<body>

    <header>

        <button
            class="menu-lateral-button"
            id="menuBtn"
            type="button"
            aria-label="Abrir dashboard"
            aria-expanded="false"
            aria-controls="dashboard">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="logo">
            HokuPédia
        </div>

    </header>

    <button class="menu-lateral-overlay" id="menuOverlay" type="button" aria-label="Fechar dashboard" hidden></button>

    <aside class="menu-lateral-dashboard" id="dashboard" aria-labelledby="dashboardTitle" aria-hidden="true" inert>
        <div class="menu-lateral-dashboard-header">
            <h2 id="dashboardTitle">Dashboard</h2>
            <button class="menu-lateral-close" id="closeDashboard" type="button" aria-label="Fechar dashboard">×</button>
        </div>
        <nav class="menu-lateral-items" aria-label="Itens do dashboard">
            <button class="menu-lateral-item" type="button" data-href="/HTML/Login.html">Login</button>
            <button class="menu-lateral-item" type="button" data-href="/HTML/Biblioteca.html">Biblioteca</button>
            <button class="menu-lateral-item" type="button" data-href="/index.html">Home</button>
        </nav>
        <p class="menu-lateral-selection" id="dashboardSelection" aria-live="polite">Selecione um item.</p>
    </aside>


    <main class="tela">

        <div class="card">

            <div class="abas">

                <button class="aba ativa">
                    Cadastro
                </button>

                <div class="linha"></div>

                    <button class="aba" id="btnLogin">
                    Login
                    </button>
 


            </div>


            <form id="formCadastro">

                <div class="campo">
                    <label for="email">E-mail:</label>

                    <input
                        type="email"
                        id="email"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="confirmarEmail">
                        Confirmar E-mail:
                    </label>

                    <input
                        type="email"
                        id="confirmarEmail"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="senha">Senha:</label>

                    <input
                        type="password"
                        id="senha"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="confirmarSenha">
                        Confirmar Senha:
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        required
                    >
                </div>


                <button
                    type="submit"
                    class="botao-cadastrar"
                >
                    Cadastrar
                </button>

            </form>

        </div>

    </main>


    <script type="module" src="../JAVA/MenuLat.js"></script>
    <script type="module" src="../JAVA/Cadastro.js"></script>

</body>

</html>
