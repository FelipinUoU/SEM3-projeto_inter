<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#35333e">
    <title>Homologação | HokuPédia</title>
    <link rel="stylesheet" href="../CSS/Confirmacao.css">
    <link rel="stylesheet" href="../CSS/Moderacao.css">
    <link rel="stylesheet" href="../CSS/MenuLat.css">
</head>
<body class="workflow-body">
    <header class="menu-lateral-header">
        <button class="menu-lateral-button" id="menuBtn" type="button" aria-label="Abrir dashboard" aria-expanded="false" aria-controls="dashboard">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <h1 class="menu-lateral-logo"><a class="menu-brand-link" href="/" aria-label="Ir para a página inicial"><span class="menu-brand-mark" aria-hidden="true">H</span><span>HokuPédia</span></a></h1>
        <form class="barra-pesquisa" role="search" action="/HTML/Catalogo.html">
            <button type="submit" aria-label="Pesquisar">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                    <circle cx="10.8" cy="10.8" r="6.8"></circle>
                    <path d="m16 16 5 5"></path>
                </svg>
            </button>
            <input type="search" name="q" placeholder="Pesquisar..." aria-label="Pesquisar no catálogo">
        </form>
        <a class="header-login" href="/HTML/CadLog.html?mode=login">Login</a>
    </header>
    <button class="menu-lateral-overlay" id="menuOverlay" type="button" aria-label="Fechar dashboard" hidden></button>
    <aside class="menu-lateral-dashboard" id="dashboard" aria-label="Navegação principal" aria-hidden="true" inert>
        <nav class="menu-lateral-items" aria-label="Navegação principal">
            <a class="menu-lateral-item" href="/">Home</a>
            <a class="menu-lateral-item" href="/HTML/Catalogo.html">Catálogo</a>
            <a class="menu-lateral-item" href="/HTML/Biblioteca.html">Biblioteca</a>
            <a class="menu-lateral-item" href="/HTML/GerenciarObras.html">Gerenciar Obras</a>
            <a class="menu-lateral-item" href="/HTML/Homologacao.html" data-admin-only hidden aria-current="page">Homologação</a>
        </nav>
    </aside>

    <main class="homologation-main">
        <div class="homologation-heading">
            <div>
                <p class="workflow-eyebrow">Painel do administrador</p>
                <h1>Tela de Homologação</h1>
            </div>
            <a class="management-link" href="/HTML/GerenciarObras.html">Gerenciar catálogo</a>
        </div>
        <p class="workflow-feedback" id="feedback" role="status" aria-live="polite"></p>

        <section class="approval-section" aria-labelledby="moderationHeading">
            <h2 id="moderationHeading">Pedidos de Moderação</h2>
            <div class="approval-list" id="moderationRequests"></div>
        </section>
        <section class="approval-section" aria-labelledby="workHeading">
            <h2 id="workHeading">Adição de Obra</h2>
            <div class="approval-list" id="workRequests"></div>
        </section>
    </main>

    <dialog class="cover-preview-dialog" id="coverPreviewDialog" aria-label="Visualização da capa">
        <button class="cover-preview-close" type="button" aria-label="Fechar visualização">×</button>
        <img class="cover-preview-large" id="coverPreviewImage" alt="">
    </dialog>

    <script type="module" src="../JAVA/MenuLat.js"></script>
    <script type="module" src="../JS/Homologacao.js"></script>
</body>
</html>
