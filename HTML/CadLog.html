<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HokuPédia - Cadastro</title>

    <link rel="stylesheet" href="../CSS/CadLog.css">
    <link rel="stylesheet" href="../CSS/MenuLat.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header>

        <button
            class="menu-lateral-button"
            id="menuBtn"
            type="button"
            aria-label="Abrir dashboard"
            aria-expanded="false"
            aria-controls="dashboard">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="logo">
            HokuPédia
        </div>

    </header>

    <button class="menu-lateral-overlay" id="menuOverlay" type="button" aria-label="Fechar dashboard" hidden></button>

    <aside class="menu-lateral-dashboard" id="dashboard" aria-labelledby="dashboardTitle" aria-hidden="true" inert>
        <div class="menu-lateral-dashboard-header">
            <h2 id="dashboardTitle">Dashboard</h2>
            <button class="menu-lateral-close" id="closeDashboard" type="button" aria-label="Fechar dashboard">×</button>
        </div>
        <nav class="menu-lateral-items" aria-label="Itens do dashboard">
            <button class="menu-lateral-item" type="button" data-href="/HTML/Login.html">Login</button>
            <button class="menu-lateral-item" type="button" data-href="/HTML/Biblioteca.html">Biblioteca</button>
            <button class="menu-lateral-item" type="button" data-href="/HTML/Usuario.html">Home</button>
        </nav>
        <p class="menu-lateral-selection" id="dashboardSelection" aria-live="polite">Selecione um item.</p>
    </aside>


    <!-- Área de cadastro -->
    <main class="cadastro-container">

        <!-- Abas -->
        <div class="abas">

            
        <a href="/HTML/Cadastro.html">
            <button class="btn-cadastro">
            Cadastro 
            </button>
        </a>
           
            <div class="linha"></div>
        <a href="/HTML/Login.html">
            <button class="btn-login" id="btnLogin">
                Login
            </button>
        </a>

        </div>

        <!-- Opções de cadastro -->
        <div class="opcoes-cadastro">

            <button class="botao-social">
                <span class="icone">◈</span>
                Continuar com Google
            </button>


            <button class="botao-social">
                <span class="icone">◈</span>
                Continuar com Email
            </button>


            <button class="botao-social">
                <span class="icone">◈</span>
                Continuar com Facebook
            </button>

        </div>

    </main>


    <script type="module" src="../JAVA/MenuLat.js"></script>
    <script type="module" src="../JAVA/CadLog.js"></script>

</body>

</html>
