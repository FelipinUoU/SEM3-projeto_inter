<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HokuPédia - Cadastro</title>

    <link rel="stylesheet" href="../CSS/CadLog.css">
    <link rel="stylesheet" href="../CSS/MenuLat.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header>

        <button
            class="menu-lateral-button"
            id="menuBtn"
            type="button"
            aria-label="Abrir dashboard"
            aria-expanded="false"
            aria-controls="dashboard">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="logo">
            HokuPédia
        </div>

        <div class="boxbody">
            <a href="/HTML/Biblioteca.html" aria-label="Abrir biblioteca">
                <img src="../Img/PerfilExemplo.svg" alt="Avatar do perfil">
            </a>
        </div>
    </header>

    <button class="menu-lateral-overlay" id="menuOverlay" type="button" aria-label="Fechar dashboard" hidden></button>

    <aside class="menu-lateral-dashboard" id="dashboard" aria-label="Navegação principal" aria-hidden="true" inert>
        <nav class="menu-lateral-items" aria-label="Navegação principal">
            <button class="menu-lateral-item" type="button" data-href="/">Home</button>
            <button class="menu-lateral-item" type="button" data-href="/HTML/Biblioteca.html">Biblioteca</button>
            <button class="menu-lateral-item" type="button" data-href="/HTML/Login.html">Login</button>
        </nav>
    </aside>


    <!-- Área de cadastro -->
    <main class="cadastro-container">

        <!-- Abas -->
        <div class="abas">

            
        <a class="btn-cadastro" href="/HTML/Cadastro.html">Cadastro</a>
           
            <div class="linha"></div>
        <a class="btn-login" href="/HTML/Login.html">Login</a>

        </div>

        <!-- Opções de cadastro -->
        <div class="opcoes-cadastro">

            <button class="botao-social">
                <span class="icone">◈</span>
                Continuar com Google
            </button>


            <button class="botao-social">
                <span class="icone">◈</span>
                Continuar com Email
            </button>


            <button class="botao-social">
                <span class="icone">◈</span>
                Continuar com Facebook
            </button>

        </div>

    </main>


    <script type="module" src="../JAVA/MenuLat.js"></script>

</body>

</html>
