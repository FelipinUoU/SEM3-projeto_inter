<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HokuPédia - Leitura</title>
    <link rel="stylesheet" href="teste.css">
    <link rel="stylesheet" href="../../../CSS/MenuLat.css">
</head>
<body>

    <!-- Header do Site -->
    <header class="menu-lateral-header">
        <button class="menu-lateral-button" id="menuBtn" type="button" aria-label="Abrir dashboard" aria-expanded="false" aria-controls="dashboard">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="logo">HokuPédia</div>
        <div class="boxbody">
            <a href="/HTML/Biblioteca.html" aria-label="Abrir biblioteca">
                <img src="../../../Img/PerfilExemplo.svg" alt="Avatar do perfil">
            </a>
        </div>
    </header>
    <button class="menu-lateral-overlay" id="menuOverlay" type="button" aria-label="Fechar dashboard" hidden></button>
    <aside class="menu-lateral-dashboard" id="dashboard" aria-labelledby="dashboardTitle" aria-hidden="true" inert>
        <div class="menu-lateral-dashboard-header">
            <h2 id="dashboardTitle">HokuPedia</h2>
            <button class="menu-lateral-close" id="closeDashboard" type="button" aria-label="Fechar dashboard">×</button>
        </div>
        <nav class="menu-lateral-items" aria-label="Itens do dashboard">
            <button class="menu-lateral-item" type="button" data-href="/HTML/Login.html">Login</button>
            <button class="menu-lateral-item" type="button" data-href="/HTML/Biblioteca.html">Biblioteca</button>
            <button class="menu-lateral-item" type="button" data-href="/HTML/Usuario.html">Home</button>
        </nav>
    </aside>

    <!-- Conteúdo da Página / Leitura -->
    <div class="main-container">
        <h1 class="titulo-manga">My Little Pony: Friendship is Magic</h1>
        <div class="breadcrumb">Home / Título do Manga / <span id="current-chapter-breadcrumb">Capitulo 1</span></div>

        <!-- Controles de Leitura e Modo de Exibição -->
        <div class="controls-row">
            <button class="btn-select">Capitulo 1 <span>▼</span></button>
            
            <!-- Menu seletor de Modo de Leitura -->
            <div class="dropdown-container">
                <button class="btn-select" id="view-mode-btn">Vertical <span>▼</span></button>
                <div class="dropdown-menu" id="view-dropdown">
                    <button data-mode="vertical">Vertical (Contínuo)</button>
                    <button data-mode="horizontal">Horizontal (Tela Cheia)</button>
                </div>
            </div>
        </div>

        <!-- Área onde as páginas do mangá são renderizadas -->
        <div class="reader-viewport vertical-mode" id="reader-viewport">
            <div class="manga-page-wrapper" data-page="0">
                <img src="../TELA DE LEITURA/testeImagens/000.png" data-original="000.png" alt="Capa" class="manga-page">
            </div>
            <div class="manga-page-wrapper" data-page="1">
                <img src="../TELA DE LEITURA/testeImagens/001.jpg" data-original="001.jpg" alt="Página 1" class="manga-page">
            </div>
            <div class="manga-page-wrapper" data-page="2">
                <img src="../TELA DE LEITURA/testeImagens/002.jpg" data-original="002.jpg" alt="Página 2" class="manga-page">
            </div>
            <div class="manga-page-wrapper" data-page="3">
                <img src="../TELA DE LEITURA/testeImagens/003.jpg" data-original="003.jpg" alt="Página 3" class="manga-page">
            </div>
            <div class="manga-page-wrapper" data-page="4">
                <img src="../TELA DE LEITURA/testeImagens/004.jpg" data-original="004.jpg" alt="Página 4" class="manga-page">
            </div>
            <div class="manga-page-wrapper" data-page="5">
                <img src="../TELA DE LEITURA/testeImagens/005.jpg" data-original="005.jpg" alt="Página 5" class="manga-page">
            </div>
            <div class="manga-page-wrapper" data-page="6">
                <img src="../TELA DE LEITURA/testeImagens/006.jpg" data-original="006.jpg" alt="Página 6" class="manga-page">
            </div>
            <div class="manga-page-wrapper" data-page="7">
                <img src="../TELA DE LEITURA/testeImagens/007.jpg" data-original="007.jpg" alt="Página 7" class="manga-page">
            </div>
            <div class="manga-page-wrapper" data-page="8">
                <img src="../TELA DE LEITURA/testeImagens/008.jpg" data-original="008.jpg" alt="Página 8" class="manga-page">
            </div>
            <div class="manga-page-wrapper" data-page="9">
                <img src="../TELA DE LEITURA/testeImagens/009.jpg" data-original="009.jpg" alt="Página 9" class="manga-page">
            </div>
            <div class="manga-page-wrapper" data-page="10">
                <img src="../TELA DE LEITURA/testeImagens/010.jpg" data-original="010.jpg" alt="Página 10" class="manga-page">
            </div>
            <div class="manga-page-wrapper" data-page="11">
                <img src="../TELA DE LEITURA/testeImagens/011.jpg" data-original="011.jpg" alt="Página 11" class="manga-page">
            </div>
            <div class="manga-page-wrapper" data-page="12">
                <img src="../TELA DE LEITURA/testeImagens/012.jpg" data-original="012.jpg" alt="Página 12" class="manga-page">
            </div>
            <div class="manga-page-wrapper" data-page="13">
                <img src="../TELA DE LEITURA/testeImagens/013.jpg" data-original="013.jpg" alt="Página 13" class="manga-page">
            </div>
            <div class="manga-page-wrapper" data-page="14">
                <img src="../TELA DE LEITURA/testeImagens/014.png" data-original="014.png" alt="Página 14" class="manga-page">
            </div>
        </div>

        <!-- Tela de Fim de Capítulo -->
        <div class="end-chapter-card">
            <h3>Fim do capítulo 1</h3>
            <div class="end-actions">
                <button class="btn-chapter-nav">❮ Capítulo 0</button>
                <button class="btn-chapter-nav main-indice">Índice</button>
                <button class="btn-chapter-nav">Capítulo 2 ❯</button>
            </div>
            
            <div class="recommendations">
                <h4>Leia também</h4>
                <div class="rec-grid">
                    <div class="rec-item">
                        <div class="rec-thumb">Capa</div>
                        <div class="rec-title">Título genérico..</div>
                    </div>
                    <div class="rec-item">
                        <div class="rec-thumb">Capa</div>
                        <div class="rec-title">Título genérico</div>
                    </div>
                    <div class="rec-item">
                        <div class="rec-thumb">Capa</div>
                        <div class="rec-title">Título genérico</div>
                    </div>
                    <div class="rec-item">
                        <div class="rec-thumb">Capa</div>
                        <div class="rec-title">Título genérico</div>
                    </div>
                    <div class="rec-item">
                        <div class="rec-thumb">Capa</div>
                        <div class="rec-title">Título genérico</div>
                    </div>
                    <div class="rec-item">
                        <div class="rec-thumb">Capa</div>
                        <div class="rec-title">Título genérico</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Barra Inferior Flutuante com o Botão de Tradução -->
    <div class="floating-nav-bar">
        <button class="nav-arrow" id="prev-page-btn">❮</button>
        
        <div class="chapter-indicator" id="page-counter">
            <span>︽</span> Cap. 1 (1/15) <span>︾</span>
        </div>

        <div class="translation-container">
            <select id="target-lang">
                <option value="en">Inglês (EN)</option>
                <option value="es">Espanhol (ES)</option>
                <option value="ja">Japonês (JA)</option>
                <option value="fr">Francês (FR)</option>
            </select>
            <button class="btn-translate-gemini" id="translate-btn" title="Traduzir quadrinho com Gemini">
                <span class="gemini-icon"></span> <span id="translate-text">Tradução</span>
            </button>
        </div>

        <button class="nav-arrow" id="next-page-btn">❯</button>
    </div>

    <script type="module" src="teste.js"></script>
    <script type="module" src="../../../JAVA/MenuLat.js"></script>
</body>
</html>
