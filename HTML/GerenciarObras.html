<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#29272f">
    <title>Gerenciar Obras | HokuPédia</title>
    <link rel="stylesheet" href="../CSS/Confirmacao.css">
    <link rel="stylesheet" href="../CSS/GerenciarObras.css">
    <link rel="stylesheet" href="../CSS/MenuLat.css">
</head>
<body hidden style="display: none">
    <header class="menu-lateral-header">
        <button class="menu-lateral-button" id="menuBtn" type="button" aria-label="Abrir dashboard" aria-expanded="false" aria-controls="dashboard">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <h1 class="menu-lateral-logo"><a href="/" aria-label="Ir para a página inicial">HokuPédia</a></h1>
        <form class="work-search" role="search" autocomplete="off">
            <label class="work-search__label" for="work-search-input">Buscar obra por nome</label>
            <input id="work-search-input" type="search" name="q" placeholder="Buscar obra..." aria-autocomplete="list" aria-controls="work-search-results" aria-expanded="false">
            <div class="work-search__results" id="work-search-results" role="listbox" aria-live="polite" hidden></div>
        </form>
        <a class="header-login" href="/HTML/CadLog.html?mode=login">Login</a>
    </header>
    <button class="menu-lateral-overlay" id="menuOverlay" type="button" aria-label="Fechar dashboard" hidden></button>
    <aside class="menu-lateral-dashboard" id="dashboard" aria-label="Navegação principal" aria-hidden="true" inert>
        <nav class="menu-lateral-items" aria-label="Navegação principal">
            <a class="menu-lateral-item" href="/HTML/Catalogo.html">Catálogo</a>
            <a class="menu-lateral-item" href="/HTML/Biblioteca.html">Biblioteca</a>
            <a class="menu-lateral-item" href="/HTML/CadLog.html?mode=login">Login</a>
        </nav>
    </aside>

    <main class="management-page">
        <div class="page-heading">
            <div>
                <h1 id="pageTitle">Gerenciamento de Obras</h1>
            </div>
            <button class="add-work-button" id="addWorkButton" type="button">
                <span aria-hidden="true">＋</span>
                Adicionar Obra
            </button>
        </div>

        <section class="moderation-request" id="moderationRequestRegion" hidden>
            <p class="moderation-intro">Peça acesso para contribuir com a criação e organização de obras e capítulos da comunidade.</p>
            <section class="request-status" id="requestStatus" aria-live="polite" hidden>
                <strong id="requestStatusTitle"></strong>
                <p id="requestStatusDescription"></p>
                <button class="submit-button retry-moderation-button" id="retryModerationButton" type="button" hidden>
                    Pedir de novo
                </button>
            </section>
            <p class="feedback" id="requestFeedback" role="status" aria-live="polite"></p>
            <form class="moderation-form" id="moderationForm">
                <label class="field" for="preferredLanguages">
                    Idioma preferido
                    <select id="preferredLanguages" name="idiomas_preferencia" required>
                        <option value="" selected disabled>Selecione um idioma</option>
                        <option value="Português (Brasil)">Português (Brasil)</option>
                        <option value="Inglês">Inglês</option>
                        <option value="Espanhol">Espanhol</option>
                        <option value="Japonês">Japonês</option>
                        <option value="Francês">Francês</option>
                    </select>
                </label>
                <label class="field" for="motivation">
                    Motivação
                    <textarea id="motivation" name="motivos" maxlength="5000" required placeholder="Conte por que deseja ajudar a comunidade como moderador."></textarea>
                </label>
                <div class="form-actions">
                    <a class="cancel-button" href="/HTML/Biblioteca.html">Cancelar</a>
                    <button class="submit-button" type="submit">Enviar solicitação</button>
                </div>
            </form>
        </section>

        <section id="workManagementRegion" hidden>
            <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
            <section class="editor-region" id="editorRegion" aria-live="polite"></section>
            <section class="work-list" id="workList" aria-label="Obras cadastradas"></section>
        </section>
    </main>

    <dialog class="operation-progress-dialog" id="operationProgressDialog" aria-labelledby="operationProgressMessage">
        <span class="operation-progress-spinner" aria-hidden="true"></span>
        <p id="operationProgressMessage" role="status" aria-live="polite"></p>
    </dialog>

    <dialog class="image-preview-dialog" id="imagePreviewDialog" aria-label="Visualização da imagem">
        <button class="image-preview-close" type="button" aria-label="Fechar visualização">×</button>
        <img class="image-preview-large" id="imagePreviewImage" alt="">
    </dialog>

    <script type="module" src="../JAVA/MenuLat.js"></script>
    <script type="module" src="../JS/WorkSearch.js"></script>
    <script type="module" src="../JS/GerenciarObras.js"></script>
</body>
</html>
