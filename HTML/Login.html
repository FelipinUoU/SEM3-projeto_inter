<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HokuPédia - Login</title>

    <link rel="stylesheet" href="../CSS/Login.css">
    <link rel="stylesheet" href="../CSS/MenuLat.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header>

        <button
            class="menu-lateral-button"
            id="menuBtn"
            type="button"
            aria-label="Abrir dashboard"
            aria-expanded="false"
            aria-controls="dashboard">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="logo">
            HokuPédia
        </div>

        <div class="boxbody">
            <a href="/HTML/Biblioteca.html" aria-label="Abrir biblioteca">
                <img src="../Img/PerfilExemplo.svg" alt="Avatar do perfil">
            </a>
        </div>
    </header>

    <button class="menu-lateral-overlay" id="menuOverlay" type="button" aria-label="Fechar dashboard" hidden></button>

    <aside class="menu-lateral-dashboard" id="dashboard" aria-labelledby="dashboardTitle" aria-hidden="true" inert>
        <div class="menu-lateral-dashboard-header">
            <h2 id="dashboardTitle">HokuPedia</h2>
            <button class="menu-lateral-close" id="closeDashboard" type="button" aria-label="Fechar dashboard">×</button>
        </div>
        <nav class="menu-lateral-items" aria-label="Itens do dashboard">
            <button class="menu-lateral-item" type="button" data-href="/HTML/Login.html">Login</button>
            <button class="menu-lateral-item" type="button" data-href="/HTML/Biblioteca.html">Biblioteca</button>
            <button class="menu-lateral-item" type="button" data-href="/HTML/Usuario.html">Home</button>
        </nav>
    </aside>

    <!-- Área principal -->
    <main class="tela">

        <div class="card">

            <!-- Abas -->
            <div class="abas">

                <button
                    class="aba"
                    id="btnCadastro">
                    Cadastro
                </button>

                <div class="linha"></div>

                <button class="aba ativa">
                    Login
                </button>

            </div>


            <!-- Formulário -->
            <form id="formLogin">

                <div class="campo">

                    <label for="email">
                        E-mail:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha:
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="botao-entrar">
                    Entrar
                </button>

            </form>

        </div>

    </main>


    <script type="module" src="../JAVA/MenuLat.js"></script>
    <script type="module" src="../JAVA/login.js"></script>

</body>

</html>
